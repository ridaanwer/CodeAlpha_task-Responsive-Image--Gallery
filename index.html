<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha - Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Image Gallery</h1>
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">all</button>
      <button class="filter-btn" data-filter="nature">nature</button> 
      <button class="filter-btn" data-filter="foods">foods</button>
      <button class="filter-btn" data-filter="designs">designs</button> 
    </div>
  </header>
  <main class="gallery-container">
    <div class="gallery-item" data-category="nature">
      <img src="nature-unsplash (1).jpg" alt="Golden horizon"> 
      <div class="overlay"><span>Golden horizon</span></div> 
    </div>
    <div class="gallery-item" data-category="foods">
      <img src="patter unsplash1.jpg" alt="delicious platter"> 
      <div class="overlay"><span>delicious platter</span></div> 
    </div>
    <div class="gallery-item" data-category="designs">
      <img src="2h-mediaunsplash1.jpg" alt="canva design">
      <div class="overlay"><span>canva design</span></div>  
    </div>
    <div class="gallery-item" data-category="nature">
      <img src="swimming unsplash 3.jpg" alt=" depthswimming">
      <div class="overlay"><span> depthswimming</span></div>  
    </div>
    <div class="gallery-item" data-category="foods">
      <img src="tukhfatullina unsplash2.jpg" alt="tukhfatullina pastry">
      <div class="overlay"><span>tukhfatullina pastry</span></div> 
    </div>
    <div class="gallery-item" data-category="designs">
      <img src="creatvise unsplash3.jpg" alt="web design"> 
      <div class="overlay"><span>web design</span></div> 
    </div>
  </main> 
  <div id="lightbox" class="lightbox">
    <span class="close-btn">&times;</span>
    <button class="nav-btn prev-btn">&#10094;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="Full View">
      <p id="lightbox-caption"></p>
    </div>
    <button class="nav-btn next-btn">&#10095;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
